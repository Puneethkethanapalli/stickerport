name: CI

# spec §17 M0 acceptance: "App launches; CI green".
#
# Triggers on every push and PR. `main` is the only branch worth running on, but a feature branch
# gets the same treatment, because the point is to catch a break *before* it merges.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # T0.5's "How to test": push a branch; CI is green. This makes a manual re-run possible when
  # a push lands while the runner is being flaky.
  workflow_dispatch:

# A new push to the same branch supersedes the in-flight run. Without this, a burst of pushes
# burns runner minutes re-testing commits nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read by AGP/Hilt/Room tooling and the Gradle wrapper. `local.properties` is gitignored (it holds
  # a machine-specific `sdk.dir`), so the SDK location is injected here instead.
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # spec §6 requires Java 17 bytecode; AGP 9 and Gradle 9 need a JDK 21 toolchain. Matches
          # the local toolchain exactly (mise JDK 21.0.2), so CI and local behave identically.
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        # Non-interactive. Without this the first `sdkmanager` call hangs waiting for a prompt that
        # never arrives, and the job times out rather than failing with a useful message.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK platforms and build tools
        # Must match `app/build.gradle.kts` exactly:
      #   compileSdk 37 + compileSdkMinor 2  ->  platforms;android-37.2
      #   buildToolsVersion (AGP default)   ->  37.0.0
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-37.2" \
            "build-tools;37.0.0"

      - name: Write local.properties
        # `sdk.dir` is the one thing a fresh checkout cannot infer. Writing it here rather than
        # relying on ANDROID_HOME keeps it explicit and matches how the local build is set up.
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle and Android build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify no environment variables are required for a build
        # A documented property of this project: the build must work from a bare shell, with no
        # JAVA_HOME, no ANDROID_HOME, no secrets. That guarantee is worth asserting, because
        # `local.properties` plus the committed wrapper is what makes it true, and the next person
        # to add an env-var dependency would otherwise never notice.
        run: env -i HOME="$HOME" PATH="$PATH" ./gradlew --version

      - name: Unit tests
        # `test` (not `testDebugUnitTest`) so the release variant is covered too — R8 and the
        # release build config can break a test that passes in debug.
        #
        # The Vintage engine is what makes Robolectric/Compose-UI-rule tests run at all; see the
        # comment on that line in app/build.gradle.kts.
        run: ./gradlew test --stacktrace

      - name: Assemble debug and release
        # Release runs R8 + lintVitalRelease. This is the gate that catches a keep-rule mistake
        # (T0.2 already found one: AGP 9 no longer accepts `proguard-android.txt`).
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: ignore
          retention-days: 14

  # Instrumented tests are a separate job on purpose: they need a device or emulator, they take
  # ~7 minutes, and running them on every push would dominate CI time. They are wired but not
  # enabled yet — see the note below.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: false # T0.5: enable once the emulator image is cached; see plan.md §9.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Enable KVM
        # Without KVM the x86_64 emulator runs under full software emulation: roughly 20x slower,
        # which turns a 7-minute suite into a timeout.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on an API 26 emulator
        # API 26 is the `minSdk` floor (spec NFR-1), and the app is verified on API 26 locally, so
        # CI covers the same end of the range rather than a different one.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --stacktrace
          disable-animations: true

      - name: Upload the instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore
