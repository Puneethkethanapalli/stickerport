# Stickerport — Gradle settings.
# See https://docs.gradle.org/current/userguide/build_environment.html

# 4 GB is enough for AGP 9 + KSP + R8 on this project; raise it if a native build needs more.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Non-transitive R classes: each module only sees its own resources. Much faster incremental builds.
android.nonTransitiveRClass=true

# AGP 9 already defaults these to true; stated explicitly so the intent survives an AGP change.
android.useAndroidX=true
